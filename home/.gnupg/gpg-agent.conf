# Custom script to delegate pinentry to the appropriate implementation.
pinentry-program ~/.local/bin/pinentry

# Allow the GPG agent to act as an SSH agent.
enable-ssh-support

# Ensure the cache TTLs are the same for both PGP and SSH use cases.
default-cache-ttl 1800
default-cache-ttl-ssh 1800
max-cache-ttl 7200
max-cache-ttl-ssh 7200

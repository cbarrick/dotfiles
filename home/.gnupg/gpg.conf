#
# This is an implementation of the Riseup OpenPGP Best Practices
# https://help.riseup.net/en/security/message-security/openpgp/best-practices
#
# This file is customized from those reccomendations. In particular, that guide
# is deprecated and reccomends using GPGs defaults, so I do not include any
# algorithm and ciphers options here.
#
# I use Sequoia PGP as my main PGP implementation anyway, so algorithm and
# ciphers options are mostly moot for my use case.
#


#-----------------------------
# default key
#-----------------------------

# The default key to sign with. If this option is not used, the default key is
# the first key found in the secret keyring

default-key 1053AF4DA678FEF285A06005FFD9B129EF9B0DF2


#-----------------------------
# behavior
#-----------------------------

# Disable inclusion of the version string in ASCII armored output
no-emit-version

# Disable comment string in clear text signatures and ASCII armored messages
no-comments

# Display long key IDs
keyid-format long

# List all keys (or the specified ones) along with their fingerprints
with-fingerprint

# Display the calculated validity of user IDs during key listings
list-options show-uid-validity
verify-options show-uid-validity

# Cross-certify subkeys are present and valid
require-cross-certification

# Disable caching of passphrase for symmetrical ops
no-symkey-cache

# Try to use the GnuPG-Agent. With this option, GnuPG first tries to connect to
# the agent before it asks for a passphrase. Also enables smartcard.
use-agent

# UTF-8 support for compatibility
charset utf-8

# Disable putting recipient key IDs into messages
throw-keyids
